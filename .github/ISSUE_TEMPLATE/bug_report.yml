name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug] "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a report. For security vulnerabilities, follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact commands or steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: 17
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include the OS, Docker version, architecture, Ollama version, model, and relevant command output.
    validations:
      required: true
