name: Question
description: Ask a question specifically about this project
title: "[Question] "
labels:
  - "type: question"
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to accomplish and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant configuration, commands, or a small code example.
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include relevant Java, Docker, Ollama, and Testcontainers versions.
