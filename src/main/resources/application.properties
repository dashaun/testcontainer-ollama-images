logging.level.root=off
spring.http.converters.preferred-json-mapper=jackson2
spring.jackson.use-jackson2-defaults=true
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=ERROR

spring.main.banner-mode=off
spring.main.web-application-type=none
spring.shell.history.enabled=false
# Spring Shell 4.x: interactive mode takes precedence and silently ignores command-line
# arguments, so this must stay false for `java -jar app.jar generate --ollamaVersion X`.
spring.shell.interactive.enabled=false